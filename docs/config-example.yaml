googleGemini:
  apiKey: "YOUR_API_KEY"
  model: "gemini-3-pro-preview"
  imageModel: "gemini-3-pro-image-preview"
  generationConfig:
    temperature: 0.3
    topP: 0.9
  safetySettings: []

openAI:
  apiKey: "YOUR_API_KEY"
  model: "gpt-4.1"
  endpoint: "https://api.openai.com/v1/responses"

llmProxy:
  host: "127.0.0.1"
  port: 8787
  authToken: "OPTIONAL_SHARED_PROXY_TOKEN"
  users: "alice:secret,bob:password" # optional cookie-login users for /proxy
  corsOrigin: "*"
  rootRedirectPath: "/proxy"
  session:
    cookieName: "llm_proxy_session"
    ttlMs: 2592000000
    secure: false
  app:
    dir: "testApp/dist"
    routePrefix: "/proxy" # current client route expects /proxy
  cache:
    enabled: true
    dir: ".cache/llm-proxy"
    ttlMs: 604800000
    maxBodyBytes: 20971520
  asyncJobs:
    pollIntervalMs: 1500
    ttlMs: 3600000
    maxJobs: 100
  log:
    enabled: true
    dir: ".cache/llm-proxy-logs"
    file: "server.log"
    maxBytes: 5242880
    maxFiles: 5
  tasks:
    dir: ".cache/llm-proxy-tasks"
    detectPageConcurrency: 2
    detectFirstPages: 3
    detectBatchSize: 3 # progressive structured extraction uses local pdfseparate and pdfunite when available
    detectMinSplitBytes: 1048576 # skip page splitting for small PDFs at or below this size
  openAI:
    apiKey: "YOUR_OPENAI_API_KEY"
    baseUrl: "https://api.openai.com/v1"
  gemini:
    apiKey: "YOUR_GEMINI_API_KEY"
    baseUrl: "https://generativelanguage.googleapis.com"
    model: "gemini-3-flash-preview"
    binaryInputModel: "gemini-3-pro-image-preview" # optional
    analytics:
      dir: ".cache/llm-proxy-analytics"
      retentionDays: 14
      dailyMaxCalls: 1000
      dailyMaxTokens: 1000000
      backofficePath: "/proxy/backoffice/gemini-analytics" # server-rendered, session-only

testApp:
  llmTransport:
    proxyBaseUrl: "/api/tasks"
    proxyAuthToken: "OPTIONAL_SHARED_PROXY_TOKEN"
  proxyRoute:
    url: "/proxy"
    authBaseUrl: "/proxy/api/auth"
    taskBaseUrl: "/proxy/api/tasks"

structuredExtract:
  provider: "gemini" # or "openai"
  model: "gemini-3-flash-preview"
  minSplitPages: 8

googleGemini:
  apiKey: "YOUR_API_KEY"
  model: "gemini-3-pro-preview"
  imageModel: "gemini-3-pro-image-preview"
  generationConfig:
    temperature: 0.3
    topP: 0.9
  safetySettings: []

openAI:
  apiKey: "YOUR_API_KEY"
  model: "gpt-4.1"
  endpoint: "https://api.openai.com/v1/responses"

llmProxy:
  host: "127.0.0.1"
  port: 8787
  authToken: "OPTIONAL_SHARED_PROXY_TOKEN"
  users: "alice:secret,bob:password" # optional cookie-login users for /proxy
  corsOrigin: "*"
  rootRedirectPath: "/proxy"
  session:
    cookieName: "llm_proxy_session"
    ttlMs: 2592000000
    secure: false
  app:
    dir: "testApp/dist"
    routePrefix: "/proxy" # current client route expects /proxy
  cache:
    enabled: true
    dir: ".cache/llm-proxy"
    ttlMs: 604800000
    maxBodyBytes: 20971520
  asyncJobs:
    pollIntervalMs: 1500
    ttlMs: 3600000
    maxJobs: 100
  openAI:
    apiKey: "YOUR_OPENAI_API_KEY"
    baseUrl: "https://api.openai.com/v1"
  gemini:
    apiKey: "YOUR_GEMINI_API_KEY"
    baseUrl: "https://generativelanguage.googleapis.com"
    model: "gemini-3-flash-preview"
    binaryInputModel: "gemini-3-pro-image-preview" # optional

testApp:
  llmTransport:
    mode: "proxy" # or "direct"
    proxyBaseUrl: "/api/llm"
    proxyAuthToken: "OPTIONAL_SHARED_PROXY_TOKEN"
  proxyRoute:
    url: "/proxy"
    authBaseUrl: "/proxy/api/auth"
    llmBaseUrl: "/proxy/api/llm"

structuredExtract:
  provider: "gemini" # or "openai"
  apiKey: "YOUR_API_KEY"
  model: "gemini-3-pro-preview"
